apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-tls
  namespace: tools
spec:
  commonName: Vaultwarden
  dnsNames:
    - "*.wheezy.lab"
  duration: 4320h
  issuerRef:
    kind: ClusterIssuer
    name: ingress
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: vaultwarden-tls
  subject:
    organizationalUnits:
      - Kubernetes
    organizations:
      - wheezy.lab
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: tools
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 32301
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vaultwarden
  namespace: tools
  labels:
    kubernetes.io/service-name: vaultwarden
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 32301
endpoints:
  - addresses:
      - 192.168.1.88
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: tools
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - vault.wheezy.lab
      secretName: vaultwarden-tls
  rules:
    - host: vault.wheezy.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
